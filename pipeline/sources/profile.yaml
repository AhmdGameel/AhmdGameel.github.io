projects:
  - id: tower-health-stream
    name: Tower Health Stream
    kind: Streaming
    featured: true
    repo: tower-health-stream
    summary: A streaming pipeline that monitors simulated telemetry from 10,192 real Egyptian cell tower locations.
    problem: >
      Telecom teams often learn about a weak tower only after customers complain. I wanted to
      see how early a streaming pipeline could flag it.
    built: >
      Kafka carries tower events, Flink validates them and detects anomalies in 10 minute windows,
      a Python service adds live weather to each alert, Iceberg stores history, and Grafana shows
      the results. Airflow and dbt handle the batch side.
    result: >
      In local tests on Docker it handled about 2,000 events per second and raised alerts in
      under 150 ms.
    metrics:
      - { label: towers, value: "10,192" }
      - { label: events per second, value: "~2,000" }
      - { label: alert latency, value: "< 150 ms" }
      - { label: services, value: "9 in Docker" }
    stack: [Kafka, Flink, Iceberg, Airflow, dbt, DuckDB, PostgreSQL, Grafana, Docker, Python]
    topology:
      - { id: sim, label: Tower Simulator, sub: OpenCelliD, x: 0, y: 1 }
      - { id: kafka, label: Kafka, sub: event log, x: 1, y: 1 }
      - { id: dq, label: Flink, sub: validation, x: 2, y: 0 }
      - { id: anom, label: Flink, sub: anomalies, x: 2, y: 2 }
      - { id: ice, label: Iceberg, sub: history, x: 3, y: 0 }
      - { id: wx, label: Weather API, sub: enrichment, x: 3, y: 2 }
      - { id: pg, label: PostgreSQL, sub: serving, x: 4, y: 1 }
      - { id: graf, label: Grafana, sub: dashboard, x: 5, y: 1 }
    edges: [[sim, kafka], [kafka, dq], [kafka, anom], [dq, ice], [anom, wx], [wx, pg], [dq, pg], [pg, graf]]

  - id: airflow-pyspark-etl
    name: Log Analytics ETL
    kind: Batch
    featured: true
    repo: airflow-pyspark-etl-pipeline
    summary: An Airflow and PySpark pipeline that turns raw web server logs into clean Parquet and reports.
    problem: >
      3.5 GB of raw access logs are hard to analyze and expensive to keep as text.
    built: >
      Airflow DAGs that split the logs by date, parse them with PySpark, add hostnames from a
      258K row lookup, apply data quality rules, and generate analytics reports. New files are
      picked up automatically.
    result: >
      Processed more than 10 million records, and Parquet reduced the data from 3.5 GB to about 240 MB.
    metrics:
      - { label: records, value: "10M+" }
      - { label: raw logs, value: "3.5 GB" }
      - { label: as Parquet, value: "~240 MB" }
      - { label: lookup rows, value: "258K" }
    stack: [Airflow, PySpark, Parquet, PostgreSQL, Docker, Python]
    topology:
      - { id: raw, label: Raw Logs, sub: 3.5 GB, x: 0, y: 1 }
      - { id: split, label: Split by Date, sub: Python, x: 1, y: 1 }
      - { id: parse, label: Parse, sub: PySpark, x: 2, y: 1 }
      - { id: enrich, label: Enrich, sub: hostnames, x: 3, y: 1 }
      - { id: dq, label: Clean, sub: quality rules, x: 4, y: 1 }
      - { id: rep, label: Reports, sub: JSON, x: 5, y: 1 }
    edges: [[raw, split], [split, parse], [parse, enrich], [enrich, dq], [dq, rep]]

  - id: unified-sales-warehouse
    name: Unified Sales Warehouse
    kind: Warehouse
    featured: true
    repo: unified-sales-warehouse
    summary: A SQL Server data warehouse that combines CRM and ERP sales data.
    problem: >
      Sales data came from two systems with different formats for customers and products.
    built: >
      SSIS loads the raw files into a Bronze layer, stored procedures clean and standardize them
      in Silver, and Gold exposes a star schema with fact_sales, dim_customers and dim_products.
    result: >
      One consistent model for sales reporting, where each number can be traced back to its source.
    metrics:
      - { label: sources, value: "CRM + ERP" }
      - { label: layers, value: "Bronze, Silver, Gold" }
      - { label: model, value: "Star schema" }
      - { label: tools, value: "SSIS, T-SQL" }
    stack: [SQL Server, SSIS, T-SQL, Data Modeling]
    topology:
      - { id: crm, label: CRM, sub: sales, x: 0, y: 0 }
      - { id: erp, label: ERP, sub: attributes, x: 0, y: 2 }
      - { id: br, label: Bronze, sub: raw, x: 1, y: 1 }
      - { id: sv, label: Silver, sub: cleaned, x: 2, y: 1 }
      - { id: gd, label: Gold, sub: star schema, x: 3, y: 1 }
    edges: [[crm, br], [erp, br], [br, sv], [sv, gd]]

