projects:
  - id: tower-health-stream
    name: Tower Health Stream
    kind: Streaming
    featured: true
    repo: tower-health-stream
    summary: A streaming pipeline that watches simulated telemetry from 10,192 real Egyptian cell tower locations.
    problem: >
      Telecom teams often learn about a weak tower only after customers complain. I wanted to see
      how early a streaming pipeline could flag it, and whether it could tell a hardware fault from bad weather.
    built: >
      Kafka carries tower events. One Flink job validates them and routes bad records to a dead letter
      queue, a second classifies anomalies and rolls them up per area in 10 minute tumbling windows.
      A Python service adds live weather to each alert, Iceberg keeps the history, and Grafana shows
      it all. Airflow and dbt on DuckDB handle the batch side.
    result: >
      On a local Docker stack it kept up with 2,038 events per second and raised alerts in under 150 ms.
    metrics:
      - label: towers
        value: "10,192"
        kind: code
        source: simulator/data_cleaner.py
        how: OpenCelliD export for Egypt (MCC 602), kept the four national operators and dropped rows with missing coordinates or zero range.
      - label: events per second
        value: "2,038"
        kind: derived
        source: simulator/tower_simulator.py
        how: The simulator sends one event per tower every 5 seconds, so 10,192 / 5 = 2,038 events per second, sustained on a local Docker stack.
      - label: alert latency
        value: "< 150 ms"
        kind: readme
        source: README.md#latency-breakdown
        how: Sum of the measured stage latencies from the simulator to the regional_alerts topic (10 + 50 + 20 + 50 + 20 ms upper bounds).
      - label: Compose services
        value: "8"
        kind: code
        source: docker/docker-compose.yml
        how: Kafka, Kafka UI, Flink jobmanager and taskmanager, Iceberg REST catalog, PostgreSQL, Airflow and Grafana.
    decisions:
      - title: Tumbling windows for regional outages
        body: Fixed 10 minute buckets give one clean result per window, so an outage is never double counted and the logic stays deterministic.
      - title: A dead letter queue, not a silent drop
        body: Events outside the valid range go to their own topic, so bad data stays visible and can be replayed.
      - title: Weather as context
        body: Every alert is enriched with live Open-Meteo weather, so the team can tell a hardware fault from a storm and respond differently.
      - title: Kafka in KRaft mode
        body: No ZooKeeper to run, one less moving part in a local stack that already has eight services.
    next:
      - Move the Python sinks into Flink so delivery to PostgreSQL is checkpointed.
      - Add a schema registry so a producer change cannot break consumers.
      - Run it on managed services with infrastructure as code.
    media: { src: /media/tower-architecture.mp4, poster: /media/tower-architecture.jpg, caption: Architecture animation from the project README }
    stack: [Kafka, Flink, Iceberg, Airflow, dbt, DuckDB, PostgreSQL, Grafana, Docker, Python]
    topology:
      - { id: sim, label: Tower Simulator, sub: OpenCelliD, x: 0, y: 1 }
      - { id: kafka, label: Kafka, sub: event log, x: 1, y: 1 }
      - { id: dq, label: Flink, sub: validation, x: 2, y: 0 }
      - { id: anom, label: Flink, sub: anomalies, x: 2, y: 2 }
      - { id: ice, label: Iceberg, sub: history, x: 3, y: 0 }
      - { id: wx, label: Weather API, sub: enrichment, x: 3, y: 2 }
      - { id: pg, label: PostgreSQL, sub: serving, x: 4, y: 1 }
      - { id: graf, label: Grafana, sub: dashboard, x: 5, y: 1 }
    edges: [[sim, kafka], [kafka, dq], [kafka, anom], [dq, ice], [anom, wx], [wx, pg], [dq, pg], [pg, graf]]

  - id: airflow-pyspark-etl
    name: Log Analytics ETL
    kind: Batch
    featured: true
    repo: airflow-pyspark-etl-pipeline
    summary: An Airflow and PySpark pipeline that turns 3.5 GB of raw web server logs into clean Parquet and reports.
    problem: >
      Raw access logs are slow to query and expensive to keep as text. The questions people ask of
      them (who is hitting us, what fails, how much is bots) need structure first.
    built: >
      Airflow DAGs split the log by date, parse each day with PySpark, join hostnames from a 258K row
      lookup, apply quality rules and write daily analytics reports. New files are picked up automatically.
    result: >
      10.36 million records processed end to end in about 5 minutes, and Parquet cut the data from 3.5 GB to 235 MB.
    metrics:
      - label: records
        value: "10.36M"
        kind: readme
        source: README.md#processing-performance
        how: Rows parsed from the access log. 10,241,992 remain after cleaning, about 1.2% removed.
      - label: raw to Parquet
        value: "3.5 GB to 235 MB"
        kind: readme
        source: README.md#data-compression
        how: Size of the raw text log against the parsed Parquet output, 93% smaller.
      - label: end to end
        value: "~5 min"
        kind: readme
        source: README.md#processing-performance
        how: Wall clock time for all four stages on a local Docker setup.
      - label: lookup rows
        value: "258,445"
        kind: code
        source: lookup/client_hostname.csv
        how: Rows in the IP to hostname lookup used by the enrichment DAG.
    decisions:
      - title: Split by date first
        body: Daily files let Spark parse days independently and let Airflow pick up a new day as soon as it lands.
      - title: Columnar storage early
        body: Writing Parquet right after parsing means every later stage reads 93% less data.
      - title: Quality as its own stage
        body: Duplicates, malformed IPs, invalid status codes and nulls are handled in one DAG, so analytics only reads clean data.
    next:
      - Unit tests for the log parser with real sample lines.
      - Incremental runs driven by data intervals instead of folder polling.
      - Publish the daily reports as a small dashboard.
    stack: [Airflow, PySpark, Parquet, PostgreSQL, Docker, Python]
    topology:
      - { id: raw, label: Raw Logs, sub: 3.5 GB, x: 0, y: 1 }
      - { id: split, label: Split by Date, sub: Python, x: 1, y: 1 }
      - { id: parse, label: Parse, sub: PySpark, x: 2, y: 1 }
      - { id: enrich, label: Enrich, sub: hostnames, x: 3, y: 1 }
      - { id: dq, label: Clean, sub: quality rules, x: 4, y: 1 }
      - { id: rep, label: Reports, sub: JSON, x: 5, y: 1 }
    edges: [[raw, split], [split, parse], [parse, enrich], [enrich, dq], [dq, rep]]

  - id: unified-sales-warehouse
    name: Unified Sales Warehouse
    kind: Warehouse
    featured: true
    repo: unified-sales-warehouse
    summary: A SQL Server warehouse that combines CRM and ERP sales data into one star schema.
    problem: >
      Sales data lived in two systems with different keys and formats for the same customers and products.
    built: >
      SSIS loads six raw source tables into a Bronze layer, stored procedures clean and standardize them
      in Silver, and Gold exposes a star schema with fact_sales, dim_customers and dim_products as views.
    result: >
      One consistent model for sales reporting, where each number can be traced back a layer at a time.
    metrics:
      - label: source tables
        value: "6"
        kind: code
        source: scripts/bronze/ddl_bronze.sql
        how: Three CRM tables (sales, customers, products) and three ERP tables (customers, locations, categories).
      - label: customer rows
        value: "18,494"
        kind: code
        source: data/crm/cust_info.csv
        how: Raw CRM customer rows before deduplication in Silver.
      - label: layers
        value: "Bronze, Silver, Gold"
        kind: code
        source: scripts/init_database.sql
        how: One schema per layer in SQL Server.
      - label: Gold model
        value: "1 fact, 2 dims"
        kind: code
        source: scripts/gold/ddl_gold.sql
        how: fact_sales with dim_customers and dim_products, created as views.
    decisions:
      - title: Medallion layers
        body: Bronze keeps files as they arrived, Silver applies the business rules, Gold is what analysts query.
      - title: Gold as views
        body: The star schema is views over Silver, so a model change needs no reload.
      - title: Full reload in Silver
        body: TRUNCATE and INSERT keeps the procedures simple at this size. Incremental loads are the next step.
    next:
      - Slowly changing dimensions for customer history.
      - Data tests on keys and row counts between layers.
    stack: [SQL Server, SSIS, T-SQL, Data Modeling]
    topology:
      - { id: crm, label: CRM, sub: sales, x: 0, y: 0 }
      - { id: erp, label: ERP, sub: attributes, x: 0, y: 2 }
      - { id: br, label: Bronze, sub: raw, x: 1, y: 1 }
      - { id: sv, label: Silver, sub: cleaned, x: 2, y: 1 }
      - { id: gd, label: Gold, sub: star schema, x: 3, y: 1 }
    edges: [[crm, br], [erp, br], [br, sv], [sv, gd]]

