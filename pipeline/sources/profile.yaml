projects:
  - id: tower-health-stream
    name: Tower Health Stream
    kind: streaming
    featured: true
    repo: tower-health-stream
    summary: >
      Real time network intelligence for 10,192 real Egyptian cell towers. Detects tower
      degradation before customers notice, and tells weather from technical faults.
    metrics:
      - { label: throughput, value: "2,038 ev/s" }
      - { label: events per hour, value: "7.3M" }
      - { label: detection latency, value: "< 150 ms" }
      - { label: towers, value: "10,192" }
    stack: [Kafka, Flink, Iceberg, Airflow, dbt, DuckDB, PostgreSQL, Grafana, Docker, Python]
    topology:
      - { id: sim, label: Tower Simulator, sub: OpenCelliD, x: 0, y: 1 }
      - { id: kafka, label: Kafka, sub: KRaft, x: 1, y: 1 }
      - { id: dq, label: Flink DQ, sub: validate, x: 2, y: 0 }
      - { id: anom, label: Flink Anomaly, sub: 10 min window, x: 2, y: 2 }
      - { id: ice, label: Iceberg, sub: time travel, x: 3, y: 0 }
      - { id: wx, label: Weather Enrich, sub: Open-Meteo, x: 3, y: 2 }
      - { id: pg, label: PostgreSQL, sub: serving, x: 4, y: 1 }
      - { id: graf, label: Grafana, sub: 5 s refresh, x: 5, y: 1 }
    edges: [[sim, kafka], [kafka, dq], [kafka, anom], [dq, ice], [anom, wx], [wx, pg], [dq, pg], [pg, graf]]

